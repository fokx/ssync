[workspace]
members = [
    "crates/ssync-core",
    "crates/ssync-fs",
    "crates/ssync-proto",
    "crates/ssync-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
authors = ["ssync contributors"]
repository = "https://github.com/ssync/ssync"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
nix = { version = "0.29", features = ["fs", "user", "dir"] }
libc = "0.2"
tempfile = "3.17"
proptest = "1.6"

# Workspace crate references
ssync-core = { path = "crates/ssync-core" }
ssync-fs = { path = "crates/ssync-fs" }
ssync-proto = { path = "crates/ssync-proto" }
