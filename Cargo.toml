[workspace]
members = [
    "crates/ssync-core",
    "crates/ssync-fs",
    "crates/ssync-proto",
    "crates/ssync-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
authors = ["ssync contributors"]
repository = "https://github.com/ssync/ssync"
readme = "README.md"
description = "A fast, memory-safe, clean-room reimplementation of rsync in Rust"
keywords = ["rsync", "synchronization", "backup", "transfer", "cli"]
categories = ["command-line-utilities", "filesystem", "network-programming"]

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
nix = { version = "0.29", features = ["fs", "user", "dir"] }
libc = "0.2"
tempfile = "3.17"
proptest = "1.6"

# Workspace crate references
ssync-core = { version = "0.2.0", path = "crates/ssync-core" }
ssync-fs = { version = "0.2.0", path = "crates/ssync-fs" }
ssync-proto = { version = "0.2.0", path = "crates/ssync-proto" }
